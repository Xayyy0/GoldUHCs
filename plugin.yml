name: GoldUHCs
main: practicecore\PracticeCore
version: 1.0.0
api: [2.0.0, 2.1.0]
author: GoldUHCs
description: GoldUHCs practice core with FFA, ranked/unranked duels, Elo, NPCs, UHC meetups, teams and custom knockback.
load: POSTWORLD
commands:
  practice:
    description: GoldUHCs administration
    usage: /practice <setlobby|setprelobby|arena|npc|kb|hud|reload>
    aliases: [pc]
    permission: practice.admin
  meetup:
    description: UHC Meetup commands
    usage: /meetup <schedule|cancel|join|leave|status|map>
    aliases: [mt]
    permission: practice.use
  team:
    description: Meetup team commands
    usage: /team <invite|accept|deny|leave|list>
    permission: practice.use
  settings:
    description: Toggle your personal settings
    usage: /settings [setting]
    permission: practice.use
  duel:
    description: Duel queue commands
    usage: /duel <queue|leave|modes>
    permission: practice.use
  stats:
    description: Show your stats (or another player's)
    usage: /stats [player]
    permission: practice.use
  top:
    description: Show the leaderboards
    usage: /top
    aliases: [leaderboard, lb]
    permission: practice.use
  lobby:
    description: Return to the lobby
    usage: /lobby
    aliases: [hub, spawn]
    permission: practice.use
permissions:
  practice.admin:
    description: Administer the practice core
    default: op
  practice.use:
    description: Use practice commands
    default: true
